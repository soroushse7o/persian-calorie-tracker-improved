name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Audit, Lint, Coverage & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high+)
        run: npm audit --audit-level=high

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Verify build fails fast when VITE_SITE_URL is missing
        run: |
          if env -u VITE_SITE_URL npm run build >/dev/null 2>&1; then
            echo "Expected build without VITE_SITE_URL to fail!" >&2
            exit 1
          fi

      - name: Build production bundle
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://persian-calorie-tracker.vercel.app' }}
        run: npm run build

      - name: Check production bundle size budget
        run: npm run check:budget

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-bundle
          path: dist
          retention-days: 3

  e2e-offline-and-lighthouse:
    name: Offline PWA E2E & Lighthouse CI
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Install Playwright Chromium for offline E2E
        run: npx playwright install --with-deps chromium

      - name: Run Offline PWA E2E test (Log meal -> Offline -> Reload & All Tabs)
        run: npm run test:e2e

      - name: Run Lighthouse CI audit (strict — no continue-on-error)
        run: npx --yes @lhci/cli@0.15.x autorun
